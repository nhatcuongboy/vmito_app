name: Flutter CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      # Freezed and json_serializable outputs are deliberately not committed.
      # Generate them in CI so a fresh checkout sees every model member.
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed lib test packages/vmito_domain
      # Report lints locally and in editor integrations; CI blocks only on
      # analyzer errors so advisory warnings cannot prevent a release.
      - run: dart analyze --no-fatal-warnings
      - run: flutter test --exclude-tags=integration
      - run: dart test packages/vmito_domain

name: vmito_app
description: "Vmito — badminton session & tournament companion app (iOS + Android)."
publish_to: 'none'

# version: <build-name>+<build-number>
# Android: build-name -> versionName, build-number -> versionCode
# iOS: build-name -> CFBundleShortVersionString, build-number -> CFBundleVersion
# version: 1.0.0+8  # Android
version: 1.0.0+5  # iOS

environment:
  sdk: ^3.12.2

# Pub workspace. `vmito_domain` is a pure-Dart package so its tests run under
# `dart test` in seconds without the Flutter harness, and the analyzer stops
# business rules from importing UI code.
workspace:
  - packages/vmito_domain


dependencies:
  flutter:
    sdk: flutter

  # Ported business rules — the shared source of truth with vmito-fe.
  vmito_domain:
    path: packages/vmito_domain
  flutter_localizations:
    sdk: flutter

  # --- State management -----------------------------------------------------
  # Riverpod 3, manual providers only. riverpod_generator is NOT used: its
  # transitive analyzer pin conflicts with json_serializable ^6.14. See
  # docs/STATE_MANAGEMENT.md.
  flutter_riverpod: ^3.4.1

  # --- Models / serialization ----------------------------------------------
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  meta: ^1.18.0

  # --- Network / realtime ---------------------------------------------------
  dio: ^5.11.0
  socket_io_client: ^3.1.6
  connectivity_plus: ^7.3.1

  # --- Routing --------------------------------------------------------------
  # 18.x builds pages through the separate material_ui package, while this app
  # still uses Flutter's MaterialApp. That mismatch falls back to
  # NoTransitionPage and disables interactive edge-back gestures.
  go_router: ^17.4.0

  # --- Storage --------------------------------------------------------------
  # Tokens go in flutter_secure_storage (Keychain/Keystore) — never in prefs.
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5

  # --- i18n / formatting ----------------------------------------------------
  intl: ^0.20.2

  # --- UI -------------------------------------------------------------------
  cupertino_icons: ^1.0.8
  # Pinned below 4.0.0 for the same reason as `shimmer` above: that release
  # requires the standalone `material_ui` package, which conflicts with
  # stream_chat_flutter's ^3.4.1 constraint and isn't needed since this app
  # still uses Flutter's own MaterialApp.
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  flutter_lucide: ^1.11.0
  flutter_widget_from_html_core: ^0.17.2
  html: ^0.15.6
  # The application-wide standard for model-driven, validated forms.
  reactive_forms: ^18.2.2
  # Pinned below 4.0.0: that release requires the standalone `material_ui`
  # package (same ecosystem shift go_router's comment above notes), which
  # this app doesn't use, and it conflicts with stream_chat_flutter's ^3.0.0
  # constraint. Only `Shimmer.fromColors` is used — unchanged since 3.0.0.
  shimmer: ^3.0.0
  flutter_slidable: ^4.0.3

  # --- Media ----------------------------------------------------------------
  # Backend proxies uploads to Cloudinary; compress client-side to match the
  # web app's 1 MB / 1920 px budget before posting.
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1

  # --- Auth / QR ------------------------------------------------------------
  # Social login is a backend-driven OAuth redirect returning tokens as query
  # params — no PKCE code exchange on the client.
  flutter_web_auth_2: ^5.0.3
  local_auth: ^3.0.2
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0

  # --- Court call (voice + notification) ------------------------------------
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^22.2.0

  # --- Platform utils -------------------------------------------------------
  url_launcher: ^6.3.2
  # 6.1.x is incompatible with AGP 9 because its Android implementation uses
  # the removed `proguard-android.txt` default. The upstream beta switches to
  # `proguard-android-optimize.txt` and supports Flutter >= 3.32.
  flutter_inappwebview: ^6.2.0-beta.3
  share_plus: ^13.3.0
  pdf: ^3.13.0
  printing: ^5.15.0
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  google_maps_flutter: ^2.18.0
  google_places_sdk_plus: ^1.1.0
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0

  # --- Misc -----------------------------------------------------------------
  collection: ^1.19.1
  logger: ^2.7.0
  # Already transitive via stream_chat; declared directly because
  # `POST /chat/requests`'s idempotencyKey is generated with it.
  uuid: ^4.5.1
  sign_in_with_apple: ^8.1.0

  # --- Push notifications --------------------------------------------------
  firebase_core: ^4.14.0
  firebase_messaging: ^16.1.1
  riverpod: any

  # --- Chat -------------------------------------------------------------
  # 1:1 chat only. Backend (vmito-be `ChatModule`) issues the API key/token;
  # the client never talks to Stream's REST API directly.
  stream_chat_flutter: ^10.0.0
  stream_chat_persistence: ^10.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.0

  mocktail: ^1.0.5

  # Drives the minute ticker without waiting real minutes. Already present
  # transitively via flutter_test; declared because we import it directly.
  fake_async: ^1.3.3

  flutter_lints: ^6.0.0
  very_good_analysis: ^10.3.0
  integration_test:
    sdk: flutter
  swagger_dart_code_generator: ^4.1.1
  flutter_launcher_icons: ^0.14.4

# stream_chat_flutter (via its attachment picker, unused here — see
# `disableAttachments: true` on `StreamMessageComposer`) pins file_picker
# ^11.0.0, whose win32 ^5.9.0 conflicts with flutter_secure_storage_windows
# and other plugins needing win32 ^6.x. file_picker's 12.0.0 stable removed
# the `pickFiles()` params stream_chat_flutter's *source* calls
# (`withData`/`withReadStream`/`lockParentWindow`), so jumping to 12.x
# outright breaks compilation — but the late 12.0.0 betas already bumped to
# win32 ^6.x while keeping that exact old API intact (the removal landed
# only in the final 12.0.0 release). Pinning here resolves the graph without
# touching flutter_secure_storage or any other plugin. This app never builds
# for Windows, so file_picker's Windows implementation is moot either way.
dependency_overrides:
  file_picker: 12.0.0-beta.7

flutter:
  uses-material-design: true
  generate: true # enables gen_l10n from lib/l10n/*.arb (see l10n.yaml)

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

# Regenerate with `dart run flutter_launcher_icons`. Source images are
# full-bleed (no baked-in rounding/padding) — iOS/Android apply their own
# corner masks, so a source with pre-rounded corners or a white margin would
# show a visible double border or dead space on the home screen.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/generated/app_icon.png"
  adaptive_icon_background: "assets/icons/generated/adaptive_bg.png"
  adaptive_icon_foreground: "assets/icons/generated/adaptive_fg.png"
